<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ColdScan">
  <title>ColdScan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3D2E"/>
      <stop offset="1" stop-color="#07281E"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="7" y="7" width="18" height="18" rx="3.5" fill="none" stroke="url(#scan)" stroke-width="1.6"/>
  <line x1="8" y1="21" x2="24" y2="21" stroke="#22C55E" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <g stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" fill="none">
    <g id="arm">
      <path d="M16 16 L16 9.5"/>
      <path d="M16 12 L13.6 9.6"/>
      <path d="M16 12 L18.4 9.6"/>
    </g>
    <use href="#arm" transform="rotate(60 16 16)"/>
    <use href="#arm" transform="rotate(120 16 16)"/>
    <use href="#arm" transform="rotate(180 16 16)"/>
    <use href="#arm" transform="rotate(240 16 16)"/>
    <use href="#arm" transform="rotate(300 16 16)"/>
